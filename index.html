<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProData d.o.o. Velika Kladuša</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffffff, #ffffff);
            color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
}

        .container {
            max-width: 400px;
            padding: 20px;
        }

        .logo {
            width: 120px;
            height: 120px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        h1 {
            margin: 10px 0;
            font-size: 28px;
        }

        .slogan {
            font-size: 16px;
            opacity: 0.9;
            margin-bottom: 25px;
        }

        .contact {
            font-size: 14px;
            line-height: 1.8;
        }

        .contact a {
            color: #242424;
            text-decoration: none;
            border-bottom: 1px solid rgba(255,255,255,0.5);
        }

        .contact a:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <img src="prodatalogo.png" alt="Prodata Logo" class="logo">

        
        <h1>ProData d.o.o. Velika Kladuša</h1>

       
        <div class="slogan">Ulica Mahmuta Zulića 11</div>

        
        <div class="contact">
            📞 <a href="tel:+123456789">+387 37 770 079</a><br>
            📧 <a href="mailto:info@yourcompany.com">prodatadoo@gmail.com</a>
        </div>
    </div>

</body>
</html>
